apiVersion: 1
datasources:
  - name: SECOP - consulta
    uid: secop-postgres
    type: grafana-postgresql-datasource
    access: proxy
    url: ${GRAFANA_DB_HOST}:${GRAFANA_DB_PORT}
    user: $GRAFANA_DB_USER
    isDefault: true
    editable: false
    jsonData:
      database: $GRAFANA_DB_NAME
      sslmode: disable
      postgresVersion: 1600
      maxOpenConns: 5
      maxIdleConns: 2
    secureJsonData:
      password: $GRAFANA_DB_PASSWORD
